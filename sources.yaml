# ★ 搜索结果少的根本原因：每条 line 只暴露 1 个 api。
#   想让"搜一关键词出一大堆"，就把更多 searchable 的爬虫站加进 `search_sites`，
#   或在下方 `ingest` 里开启"吸收公开单仓的 sites"（自动越攒越多）。
# =========================================================

