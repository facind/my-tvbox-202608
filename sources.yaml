# =========================================================
# 自建影视仓 · 上游线路池（可自由增删，热更新）
# priority: 1-3 主用线路（进入 index 前列），>3 备用
# tags: 点播 / 4K / 蓝光 / 聚合 / 备用 / 广告 ...
# =========================================================

