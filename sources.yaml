# =========================================================
# 自建影视仓 · 上游线路池（2026-08 存活版，双层结构）
# ---------------------------------------------------------
# 设计原则：
#   1) lines:  只放"母仓"（每个内部自带 100+ 子站点）+ 从活仓提取的真实子线路
#   2) warehouses: 放多仓 JSON，CI 的 ingest 每次自动展开 -> 越攒越多
#   3) search_sites: 留空，盘搜交给大仓内部处理（扫码即可播）
#
# priority : 1-3 主用，>3 备用
# stable   : high / mid / low
# skip_check: true -> 强制保留（不做健康检查，信任声明）
# =========================================================

# =========================================================
# 单仓线路（lines）— 全部实测存活
# ---------------------------------------------------------
# 母仓类（内部自带海量 sites，是搜索覆盖的主力）：
#   - 凯速备用(fish.json) : 100+ 站点，含 4K/短剧/动漫/盘搜
#   - 饭太硬              : 标准 TVBox 导航页，客户端可展开
#   - 小盒子4K            : 4K/蓝光为主
#   - 老刘备              : 200+ 站点，含大量 App 类 spider
# =========================================================
lines:
  # ---- 母仓（每个内部自带几十条~上百条子站点）----
  - { name: 凯速备用, url: "https://6800.kstore.vip/fish.json", tags: [4K, 聚合, 搜索强], priority: 1, stable: high, skip_check: true }
  - { name: 饭太硬,   url: "http://fty.888484.xyz/",           tags: [点播, 搜索强],   priority: 1, stable: high }
  - { name: 小盒子4K, url: "http://xhztv.top/4k.json",         tags: [4K, 蓝光],       priority: 1, stable: high }
  - { name: 老刘备,   url: "https://raw.liucn.cc/box/m.json",   tags: [聚合, 搜索强],   priority: 2, stable: high }

  # ---- 从活仓 sites[] 提取的真实子线路（随母仓更新而更新）----
  - { name: 饭太硬TV, url: "http://fty.888484.xyz/tv",         tags: [点播],           priority: 2, stable: mid }
  - { name: 摸鱼4K,   url: "http://我不是.摸鱼儿.top",           tags: [4K, 蓝光],       priority: 3, stable: mid }
  - { name: 王二小,   url: "http://tvbox.王二小放牛娃.top",       tags: [点播, 聚合],     priority: 3, stable: mid }
  - { name: 菜妮丝,   url: "https://tvbox.cainisi.cf",          tags: [点播],           priority: 4, stable: mid }
  - { name: 星辰,     url: "https://raw.githubusercontent.com/xingchen/tvbox/main/xc.json", tags: [聚合, 搜索强], priority: 4, stable: mid }

# =========================================================
# 多仓（ingest 会自动展开内部单仓 -> 站点越攒越多）
# =========================================================
warehouses:
  - { name: 无邪多仓, url: "https://gh-proxy.com/https://raw.githubusercontent.com/wxrjck/-YSC-/refs/heads/main/wx.json" }
  - { name: 星辰多仓, url: "https://raw.githubusercontent.com/xingchen/tvbox/main/api.json" }
  - { name: 巧技多仓, url: "http://pandown.pro/tvbox/tvbox.json" }

# =========================================================
# 直播源
# =========================================================
lives:
  - { name: 肥猫直播, url: "http://我不是.肥猫.live/TV/tvzb.txt" }
  - { name: IPTV直播, url: "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/cn.m3u" }

# =========================================================
# 网盘解析源（flag 路由，由 spider.jar 实现；占位 URL 需自建解析服务后替换）
# =========================================================
pan_parses:
  - { name: 百度网盘, flag: baidu,  type: 18 }
  - { name: 夸克网盘, flag: quark,  type: 19 }
  - { name: UC网盘,   flag: uc,     type: 20 }
  - { name: 阿里云盘, flag: aliyun, type: 21 }
  - { name: 万能解析, flag: universal, type: 24 }

# =========================================================
# 搜索站点池（留空：盘搜由大仓内部 sites 提供，搜到后扫码播放）
# =========================================================
search_sites: []

# =========================================================
# 自动吸收公开单仓 sites（CI 每次生成时执行）
#   enabled: true  -> 从 index_urls 提取 searchable 站点并入主池
#   only_searchable: true -> 只吸收可搜索站（保证搜得出结果）
#   失效索引自动跳过，不影响主流程
# =========================================================
ingest:
  enabled: true
  max_sites_per_index: 30
  only_searchable: true
  prefer_stable: true
  index_urls:
    - "https://gh-proxy.com/https://raw.githubusercontent.com/wxrjck/-YSC-/refs/heads/main/wx.json"
    - "https://raw.githubusercontent.com/xingchen/tvbox/main/api.json"
    - "https://6800.kstore.vip/fish.json"
