# =========================================================
# 网盘解析源（flag 路由，由 spider.jar 实现具体解析）
# flag: baidu=百度网盘, quark=夸克, uc=UC网盘, aliyun=阿里云盘
# =========================================================
pan_parses:
  - { name: 百度网盘, flag: baidu,  type: 18 }
  - { name: 夸克网盘, flag: quark,  type: 19 }
  - { name: UC网盘,   flag: uc,     type: 20 }
  - { name: 阿里云盘, flag: aliyun, type: 21 }
  - { name: 万能解析, flag: universal, type: 24 }

# =========================================================
# ★ 独立"搜索型爬虫站"池（关键！决定搜索结果数量）
# 这些站会被"并联"到每条单仓的 sites[] 里，全部 searchable=1。
# 影视仓搜一个词时会对所有 searchable 站点并发搜索 → 结果成倍增加。
# 格式与单仓 sites 一致；type 多为 1(标准采集)/3(spider)/4(js 采集)。
# =========================================================
search_sites:
  # ---- 盘搜 / 网盘资源检索（搜出来就是可播的分享链接）----
  - { key: pansearch_baidu, name: 盘搜百度, type: 1, api: "https://api.pansearch.example.com/baidu", searchable: 1, filterable: 1 }
  - { key: pansearch_quark, name: 盘搜夸克, type: 1, api: "https://api.pansearch.example.com/quark", searchable: 1, filterable: 1 }
  - { key: alipan_meta,     name: 阿里云盘检索, type: 3, api: "https://api.alipan-meta.example.com/list", searchable: 1, jar: "jar/spider.jar", spider: "spider.Main" }

  # ---- 通用标题搜索（补全"搜片名出结果"的覆盖率）----
  - { key: douban_search, name: 豆瓣搜索, type: 4, api: "https://api.douban-search.example.com/", searchable: 1, quickSearch: 1 }

# =========================================================
# ★ 自动"吸收公开单仓 sites"开关（问题2的核心）
# 开启后：每次 CI 生成时，会拉取下方 index_urls 指向的多仓/单仓 JSON，
# 提取其中 searchable 的 sites，去重合并进你的主池 → 越跑越胖、自动变多。
# 代价：引入了外部依赖（与"纯自己"有取舍），故默认 true（你之前的需求是"自动抓取更多"）。
# =========================================================
ingest:
  enabled: true                # true=开启吸收；false=只用本文件手工维护的池子
  max_sites_per_index: 30      # 每个公开索引最多吸收多少条 site（防膨胀）
  only_searchable: true        # 只吸收 searchable=1 的站（保证搜得出结果）
  prefer_stable: true          # 优先吸收稳定标注高的站
  # 公开索引清单（可自行增减；失效的 CI 会自动跳过，不影响主流程）
  index_urls:
    - "https://weixine.net/api.json"
    - "https://gh-proxy.com/https://raw.githubusercontent.com/wxrjck/-YSC-/refs/heads/main/wx.json"
    - "https://gh-proxy.com/https://raw.githubusercontent.com/xingchen/tvbox/main/api.json"
