name: 影视仓聚合片源 · 自动更新与部署

# =========================================================
#  触发条件：
#   1) 定时：每 3 天 06:00 (UTC) = 北京时间 14:00
#   2) 推送/PR 到 main 立即构建（验证用）
#   3) 手动触发 (workflow_dispatch)
# =========================================================
name: Deploy

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate index & lines
        run: python3 scripts/generate.py
        env:
          ALIYUN_REFRESH_TOKEN: ${{ secrets.ALIYUN_REFRESH_TOKEN }}
          BAIDU_COOKIE: ${{ secrets.BAIDU_COOKIE }}
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          UC_COOKIE: ${{ secrets.UC_COOKIE }}

      - name: Validate output
        run: python3 scripts/validate.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2