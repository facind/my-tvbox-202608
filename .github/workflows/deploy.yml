name: 影视仓聚合片源 · 自动更新与部署

# =========================================================
#  触发条件：
#   1) 定时：每 3 天 06:00 (UTC) = 北京时间 14:00
#   2) 推送/PR 到 main 立即构建（验证用）
#   3) 手动触发 (workflow_dispatch)
# =========================================================
name: Deploy

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml requests

      - name: Generate
        run: python3 scripts/generate.py

      - name: Validate
        run: python3 scripts/validate.py

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages